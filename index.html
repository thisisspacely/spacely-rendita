<style>
  /* ============================================================
     BRAND TOKENS — colori ufficiali Spacely + neutri derivati.
     Registro: editoriale premium.
     ============================================================ */
  :root {
    --navy: #363D4E;
    --navy-deep: #2A303D;
    --teal: #27B9BA;
    --teal-deep: #1B8E8F;
    --ink: #2C313C;
    --muted: #5E6675;
    --line: #E4E7EC;
    --wash: #F5F7F8;
    --danger: #B4483C;

    --pageW: 794px;
    --pageH: 1123px;
    --pad: 66px;

    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Spectral", Georgia, "Times New Roman", serif;
    --ui: "Helvetica Neue", Arial, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--ui); color: var(--ink); background: #EBEDF0; }

  /* ============================================================
     APP SHELL (schermo)
     ============================================================ */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 360px; flex: 0 0 360px; background: #fff; height: 100vh;
    position: sticky; top: 0; overflow-y: auto; border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .sidebar__brand {
    display: flex; align-items: center; gap: 11px; padding: 20px 24px;
  }
  .sidebar__brand .sidebar__mark { width: 30px; height: auto; }
  .sidebar__brand b { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--navy); letter-spacing: -.01em; line-height: 1; }
  .sidebar__brand b, .rhead__logo b, .cover__top .wm b { white-space: nowrap; }
  /* il punto del wordmark: sempre inline e teal (vince sulle regole generiche degli span) */
  .sidebar__brand b .dot, .rhead__logo b .dot, .cover__top .wm b .dot { display: inline; color: var(--teal); font: inherit; }
  .sidebar__brand span { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

  .toolbar { padding: 4px 24px 18px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; font-size: 14px; font-weight: 700; font-family: var(--display);
    letter-spacing: .01em; color: #fff; background: var(--navy); border: none; border-radius: 10px;
    cursor: pointer; transition: background .18s cubic-bezier(.22,1,.36,1);
  }
  .btn:hover { background: var(--navy-deep); }
  .toolbar .hint { font-size: 11.5px; color: var(--muted); margin: 11px 2px 0; line-height: 1.55; }
  .toolbar .hint b { color: var(--ink); font-weight: 700; }

  .form { padding: 4px 24px 40px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 18px; }
  .form h3 {
    font-family: var(--display); font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--teal-deep); margin: 22px 0 11px; font-weight: 700;
  }
  .form h3:first-child { margin-top: 2px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 11px; font-size: 13px; font-family: var(--ui);
    border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(39,185,186,.16);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

  details.adv { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 4px; }
  details.adv > summary {
    cursor: pointer; font-family: var(--display); font-size: 11px; text-transform: uppercase;
    letter-spacing: .12em; color: var(--muted); font-weight: 700; padding: 12px 0; list-style: none;
  }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::before { content: "＋ "; color: var(--teal-deep); }
  details.adv[open] > summary::before { content: "－ "; }

  .stage {
    flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center;
    gap: 26px; overflow-y: auto; height: 100vh;
  }

  /* ============================================================
     REPORT — 4 pagine A4, editoriale premium
     ============================================================ */
  .page {
    width: var(--pageW); height: var(--pageH); background: #fff; position: relative;
    overflow: hidden; box-shadow: 0 10px 40px rgba(30,40,60,.16); margin: 0 auto;
  }
  /* forza la stampa degli sfondi colorati anche senza "Grafica di sfondo" attiva */
  .page, .page * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page__body { position: absolute; inset: 0; padding: var(--pad); display: flex; flex-direction: column; }

  .rhead {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 26px;
  }
  .rhead__logo { display: flex; align-items: center; gap: 8px; }
  .rhead__logo .rhead__mark { width: 22px; height: auto; }
  .rhead__logo b { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--navy); letter-spacing: -.01em; }
  .rhead__ctx { font-family: var(--body); font-style: italic; font-size: 10px; color: var(--muted); }

  .rfoot {
    position: absolute; left: var(--pad); right: var(--pad); bottom: 34px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px;
    font-family: var(--ui); letter-spacing: .02em;
  }
  .rfoot .pg { font-family: var(--display); font-weight: 700; color: var(--navy); }

  h1.title {
    font-family: var(--display); font-weight: 800; font-size: 33px; line-height: 1.06;
    color: var(--navy); margin: 0 0 14px; letter-spacing: -.025em; text-wrap: balance;
  }
  h2.sect {
    font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--navy);
    margin: 26px 0 12px; letter-spacing: -.015em;
  }
  h2.sect:first-child { margin-top: 0; }
  .accent-rule { width: 46px; height: 3px; background: var(--teal); border-radius: 2px; margin: 0 0 18px; }

  .lead { font-family: var(--body); font-size: 12px; line-height: 1.62; color: var(--ink); margin: 0 0 6px; max-width: 64ch; }
  p.body { font-family: var(--body); font-size: 10.6px; line-height: 1.66; color: var(--ink); margin: 0 0 9px; max-width: 68ch; }
  .small { font-family: var(--ui); font-size: 8.4px; line-height: 1.5; color: var(--muted); letter-spacing: .01em; }

  /* Banda cifre chiave — filetti, niente card */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin: 20px 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kpi { padding: 16px 18px 15px; }
  .kpi + .kpi { border-left: 1px solid var(--line); }
  .kpi .num { font-family: var(--display); font-weight: 800; font-size: 25px; color: var(--navy); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi.accent .num { color: var(--teal-deep); }
  .kpi .num.danger { color: var(--danger); }
  .kpi .lab { font-family: var(--body); font-size: 9px; color: var(--muted); line-height: 1.4; margin-top: 8px; }

  /* Tabella editoriale */
  table.data { width: 100%; border-collapse: collapse; font-size: 10px; }
  table.data th, table.data td { padding: 8px 10px; text-align: left; }
  table.data thead th {
    font-family: var(--display); font-weight: 700; font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--navy); border-bottom: 1.5px solid var(--navy);
  }
  table.data td { font-family: var(--body); color: var(--ink); border-bottom: 1px solid var(--line); }
  table.data td.n, table.data th.n { text-align: right; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  table.data thead th.n { font-weight: 700; }
  table.data td.neg { color: var(--danger); }
  table.data tr.total td { font-family: var(--display); font-weight: 800; color: var(--navy); border-top: 1.5px solid var(--navy); border-bottom: none; padding-top: 10px; font-size: 10.5px; }
  table.data tr.total td.n { color: var(--navy); }
  table.data tr.total td.hi { color: var(--teal-deep); }
  table.data tr.compare td { font-family: var(--body); font-style: italic; color: var(--muted); border-bottom: none; padding-top: 4px; }
  table.data tr.compare td.n { font-style: normal; }

  /* Callout — niente stripe laterale */
  .callout { background: var(--wash); border-top: 2px solid var(--teal); border-radius: 0 0 10px 10px; padding: 14px 18px; margin: 8px 0; }
  .callout.danger { border-top-color: var(--danger); }
  .callout p { margin: 0; font-family: var(--body); font-size: 11px; line-height: 1.6; color: var(--ink); }
  .callout .lead-in { font-family: var(--display); font-weight: 800; color: var(--navy); letter-spacing: -.01em; }
  .callout.danger .lead-in { color: var(--danger); }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }

  /* Passi avvio */
  .steps { display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 42px 1fr; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .step:last-child { border-bottom: none; }
  .step .n { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--teal); line-height: .9; letter-spacing: -.03em; }
  .step .t { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 3px; letter-spacing: -.01em; }
  .step .d { font-family: var(--body); font-size: 10.2px; color: var(--ink); line-height: 1.5; }

  .cta { background: var(--navy-deep); color: #fff; border-radius: 14px; padding: 22px 24px; margin-top: 12px; }
  .cta b { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: -.01em; }
  .cta p { margin: 8px 0 0; font-family: var(--body); font-size: 10.8px; color: #C3CAD6; line-height: 1.6; }
  .cta__urgency { margin-top: 10px; font-family: var(--display); font-weight: 700; font-size: 11px; color: var(--teal); letter-spacing: -.01em; line-height: 1.45; }
  .cta__urgency b { color: #fff; }
  .cta__foot { display: flex; justify-content: space-between; gap: 24px; margin-top: 16px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,.14); }
  .cta__label { font-family: var(--ui); font-size: 8px; text-transform: uppercase; letter-spacing: .14em; color: #8A93A3; margin-bottom: 8px; }
  .cta__team { font-family: var(--display); font-weight: 700; font-size: 11.5px; color: #fff; letter-spacing: -.01em; margin-bottom: 7px; }
  .cta__lines { font-family: var(--ui); font-size: 9.5px; color: #C3CAD6; line-height: 1.7; }
  .cta__lines a { color: #C3CAD6; text-decoration: none; }
  .cta__col--social { text-align: right; white-space: nowrap; }
  .cta__social { display: block; font-family: var(--ui); font-size: 10px; color: var(--teal); text-decoration: none; margin-bottom: 5px; }

  /* ---------- COPERTINA ---------- */
  .cover { display: flex; flex-direction: column; height: 100%; }
  .cover__top { display: flex; align-items: center; gap: 13px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .cover__top .cover__mark { width: 46px; height: auto; }
  .cover__top .wm b { font-family: var(--display); font-weight: 800; font-size: 21px; color: var(--navy); letter-spacing: -.01em; display: block; line-height: 1; }
  .cover__top .wm span { font-family: var(--body); font-style: italic; font-size: 11px; color: var(--muted); }
  .cover__meta { margin-left: auto; text-align: right; font-family: var(--ui); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); line-height: 1.7; }
  .cover__facts { display: grid; grid-template-columns: 0.9fr 0.7fr 1fr 1.4fr; border-bottom: 1px solid var(--line); }
  .cover__fact { padding: 18px 0 17px; }
  .cover__fact + .cover__fact { border-left: 1px solid var(--line); padding-left: 20px; }
  .cover__fact:last-child { padding-right: 4px; }
  .cover__fact .l { font-family: var(--ui); font-size: 8.5px; text-transform: uppercase; letter-spacing: .13em; color: var(--muted); margin-bottom: 7px; }
  .cover__fact .v { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--navy); letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
  .cover__mid { margin-top: auto; margin-bottom: auto; padding: 36px 0; }
  .cover__sub { font-family: var(--body); font-style: italic; font-size: 12.5px; color: var(--muted); margin-top: 18px; max-width: 52ch; line-height: 1.5; }
  .cover__kicker { font-family: var(--display); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--teal-deep); font-weight: 700; margin-bottom: 20px; }
  .cover__title { font-family: var(--display); font-size: 55px; line-height: 1.0; color: var(--navy); font-weight: 800; letter-spacing: -.035em; margin: 0 0 26px; text-wrap: balance; }
  .cover__addr { font-family: var(--display); font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 6px; letter-spacing: -.01em; }
  .cover__specs { font-family: var(--body); font-size: 12.5px; color: var(--muted); font-style: italic; }
  .cover__accent { height: 4px; background: var(--teal); width: 72px; border-radius: 2px; margin: 0 0 26px; }
  .cover__band { background: var(--navy-deep); color: #fff; margin: 0 calc(-1 * var(--pad)) calc(-1 * var(--pad)); padding: 24px var(--pad); }
  .cover__band .prep { font-family: var(--body); font-size: 12px; color: #C3CAD6; }
  .cover__band .prep b { color: #fff; font-weight: 600; }
  .cover__band .note { font-family: var(--ui); font-size: 8.6px; color: #8A93A3; margin-top: 10px; line-height: 1.55; max-width: 88ch; }

  .chart { width: 100%; }
  .chart text { font-family: var(--display); }

  /* ============================================================
     STAMPA
     ============================================================ */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .sidebar, .toolbar { display: none !important; }
    .app { display: block; }
    .stage { padding: 0; height: auto; overflow: visible; display: block; gap: 0; }
    .page { box-shadow: none; margin: 0; page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>

      </div>
      <form class="form" id="form"></form>

    <main class="stage">

    aliquota44: 0.21,         // cedolare 4+4 (10% se concordato)
    feeSpacely: 0.20,         // fee gestione su lordo

      realistico: adrReal,

      realistico: occReal,
      ottimista: occReal + p.deltaOccOttimista,

      const cedolare = -lordi * p.aliquotaBreve;
      const ota = -lordi * p.ota;
      const biancheria = -notti * p.biancheriaPerNotte;
      const consumabili = -lordi * p.consumabiliPct;
      const costiFissi = -(p.utenzeAnnue + p.assicurazioneAnnua + p.softwareAnnuo);
      const feeSpacely = -lordi * p.feeSpacely;
      const netto = lordi + cedolare + ota + biancheria + consumabili + costiFissi + feeSpacely;

        adr: a, occ: o, notti, lordi,
        cedolare, ota, biancheria, consumabili, costiFissi, feeSpacely,

      prudente: scenario("prudente"),
      realistico: scenario("realistico"),
      ottimista: scenario("ottimista"),

    const canoneAnnuo = input.canoneMensile * 12;

    const sfitto44 = -canoneAnnuo * p.sfitto44Pct;
    const manutenzione44 = -canoneAnnuo * p.manutenzione44Pct;
    const netto44 = canoneAnnuo + cedolare44 + sfitto44 + manutenzione44;

    const confronto44 = {
      canoneAnnuo, cedolare: cedolare44, sfitto: sfitto44,
      manutenzione: manutenzione44, netto: netto44,
    };

    const sfittoMaturato = input.canoneMensile * (input.mesiSfitto || 0);

      derivati: { adrBase, correttivoStato, premioFascia, adrManuale, occBase, occManuale, zonaLabel: zone.label, statoLabel: state.label, fasciaLabel: fascia.label },
      scenari,
      confronto44,
      sfittoMaturato,
    };
  }

      svg += `<text x="${padL}" y="${yy + 12}" font-size="11.5" font-weight="700" fill="#5B6472">${r.lab}</text>`;
      svg += `<rect x="${padL}" y="${yy + 20}" width="${barMaxW}" height="16" rx="8" fill="#EEF0F3"/>`;
      svg += `<rect x="${padL}" y="${yy + 20}" width="${barMaxW * r.v}" height="16" rx="8" fill="${r.fill}"/>`;
      svg += `<text x="${padL + barMaxW + 12}" y="${yy + 33}" font-size="15" font-weight="800" fill="${NAVY}">${r.disp}</text>`;
    });
    svg += `</svg>`;
    return svg;
  }

  // ---------- pagine ----------
  function rhead(r) {
    return `<div class="rhead"><div class="rhead__logo">${mark("rhead__mark")}<b>${wordmark}</b></div>` +
      `<div class="rhead__ctx">Analisi di Rendita — ${esc(shortAddr(r.input.indirizzo))}</div></div>`;
  }
  function rfoot(r, n) {
    return `<div class="rfoot"><span>Documento riservato · Spacely — Torino</span><span class="pg">${n} / 4</span></div>`;
  }
  function shortAddr(a) { return String(a).split("—")[0].split(",")[0].trim(); }

  function pageCover(r) {
    const zonaShort = r.derivati.zonaLabel.split("/")[0];
    return `<section class="page"><div class="page__body cover">
      <div class="cover__top">${mark("cover__mark")}<div class="wm"><b>${wordmark}</b><span>Property Management · Torino</span></div>
        <div class="cover__meta">${esc(state.periodo)}<br>Documento riservato</div>
      </div>
      <div class="cover__facts">
        <div class="cover__fact"><div class="l">Superficie</div><div class="v">${esc(r.input.mq)} mq</div></div>
        <div class="cover__fact"><div class="l">Posti letto</div><div class="v">${esc(r.input.postiLetto)}</div></div>
        <div class="cover__fact"><div class="l">Zona</div><div class="v">${esc(zonaShort)}</div></div>
        <div class="cover__fact"><div class="l">Stato</div><div class="v">${esc(r.derivati.statoLabel.replace("/", " / "))}</div></div>
      </div>
      <div class="cover__mid">
        <div class="cover__accent"></div>
        <div class="cover__kicker">Analisi di Rendita</div>
        <h1 class="cover__title">Quanto può rendere<br>il suo immobile</h1>
        <div class="cover__addr">${esc(r.input.indirizzo)}</div>
        <div class="cover__sub">Una proiezione trasparente, costruita sui dati reali del nostro portfolio. Ogni assunzione è dichiarata e verificabile a pagina 3.</div>
      </div>
      <div class="cover__band">
        <div class="prep">Preparata per <b>${esc(state.preparataPer)}</b> · ${esc(state.periodo)}</div>
        <div class="note">Proiezioni basate su dati reali di mercato e sul portfolio Spacely (PriceLabs, gen–lug 2026). Le proiezioni non costituiscono garanzia di rendimento.</div>
      </div>
    </div></section>`;
  }

  function pageProiezione(r) {
    const s = r.scenari;
    const rows = [
      ["Tariffa media notte (ADR)", eur(s.prudente.adr), eur(s.realistico.adr), eur(s.ottimista.adr), false],
      ["Occupazione", pct(s.prudente.occ), pct(s.realistico.occ), pct(s.ottimista.occ), false],
      ["Ricavi lordi annui", eur(s.prudente.lordi), eur(s.realistico.lordi), eur(s.ottimista.lordi), false],
      ["Cedolare secca (sul lordo)", eurSigned(s.prudente.cedolare), eurSigned(s.realistico.cedolare), eurSigned(s.ottimista.cedolare), true],
      ["Commissioni portali", eurSigned(s.prudente.ota), eurSigned(s.realistico.ota), eurSigned(s.ottimista.ota), true],
      ["Utenze, internet, fissi", eurSigned(s.prudente.costiFissi), eurSigned(s.realistico.costiFissi), eurSigned(s.ottimista.costiFissi), true],
      ["Gestione Spacely", eurSigned(s.prudente.feeSpacely), eurSigned(s.realistico.feeSpacely), eurSigned(s.ottimista.feeSpacely), true],
    ];
    const optional = [];
    if (s.realistico.biancheria !== 0) optional.push(["Biancheria/lavanderia", s.prudente.biancheria, s.realistico.biancheria, s.ottimista.biancheria]);
    if (s.realistico.consumabili !== 0) optional.push(["Consumabili", s.prudente.consumabili, s.realistico.consumabili, s.ottimista.consumabili]);
    optional.forEach((o) => rows.splice(6, 0, [o[0], eurSigned(o[1]), eurSigned(o[2]), eurSigned(o[3]), true]));

    const bodyRows = rows.map((rw) =>
      `<tr><td>${rw[0]}</td><td class="n ${rw[4] ? "neg" : ""}">${rw[1]}</td><td class="n ${rw[4] ? "neg" : ""}">${rw[2]}</td><td class="n ${rw[4] ? "neg" : ""}">${rw[3]}</td></tr>`
    ).join("");

    const hasSfitto = (r.input.mesiSfitto || 0) >= 1;
    const deltaReal = s.realistico.netto - r.confronto44.netto;
    // 4ª cifra chiave: canoni persi solo se c'è sfitto; altrimenti differenza vs 4+4.
    const kpi4 = hasSfitto
      ? `<div class="kpi"><div class="num danger">${eur(r.sfittoMaturato)}</div><div class="lab">Canoni già persi<br>(${esc(r.input.mesiSfitto)} mesi di sfitto)</div></div>`
      : `<div class="kpi ${deltaReal >= 0 ? "accent" : ""}"><div class="num">${eurSigned(deltaReal)}</div><div class="lab">Rispetto al 4+4<br>(netto/anno)</div></div>`;
    return `<section class="page"><div class="page__body">
      ${rhead(r)}
      <h1 class="title">Quanto può rendere il suo immobile</h1>
      <div class="accent-rule"></div>
      <p class="lead">Proiezione su 12 mesi in locazione breve gestita da Spacely, confrontata con la locazione tradizionale 4+4 al canone richiesto (${eur(r.input.canoneMensile)}/mese). Lo scenario <b>prudente</b> è il nostro impegno minimo; il <b>realistico</b> è ciò che i nostri dati indicano come più probabile.</p>

      <div class="kpis">
        <div class="kpi accent"><div class="num">${eur(s.realistico.netto)}</div><div class="lab">Netto annuo stimato<br>(scenario realistico)</div></div>
        <div class="kpi"><div class="num">${eur(s.realistico.nettoMensile)}</div><div class="lab">Netto mensile<br>equivalente</div></div>
        <div class="kpi"><div class="num">${pct(s.realistico.occ)}</div><div class="lab">Occupazione<br>attesa</div></div>
        ${kpi4}
      </div>

      ${scenarioChart(r)}

      <table class="data">
        <thead><tr><th>Voce</th><th class="n">Prudente</th><th class="n">Realistico</th><th class="n">Ottimista</th></tr></thead>
        <tbody>
          ${bodyRows}
          <tr class="total"><td>Netto proprietario / anno</td><td class="n">${eur(s.prudente.netto)}</td><td class="n hi">${eur(s.realistico.netto)}</td><td class="n">${eur(s.ottimista.netto)}</td></tr>
          <tr class="compare"><td>Confronto: netto 4+4 al canone richiesto</td><td class="n">${eur(r.confronto44.netto)}</td><td class="n">${eur(r.confronto44.netto)}</td><td class="n">${eur(r.confronto44.netto)}</td></tr>
        </tbody>
      </table>

      <div class="callout ${hasSfitto ? "danger" : ""}" style="margin-top:14px">
        <p><span class="lead-in">La lettura onesta.</span> ${honestReading(r)}</p>
      </div>
      <p class="small" style="margin-top:8px">IMU e spese condominiali escluse dal confronto perché identiche nei due regimi. Cedolare al ${pct(r.input.aliquotaBreve || r.params.aliquotaBreve)} (prima abitazione in locazione breve); dal secondo immobile l'aliquota sale al 26%. Biancheria, consumabili e pulizie a carico degli ospiti via cleaning fee.</p>
      ${rfoot(r, 2)}
    </div></section>`;
  }

  function honestReading(r) {
    const diff = r.scenari.realistico.netto - r.confronto44.netto;
    const hasSfitto = (r.input.mesiSfitto || 0) >= 1;
    const sfitto = r.sfittoMaturato;
    if (hasSfitto) {
      // Immobile fermo: la leva è lo sfitto già maturato.
      if (diff >= 0) {
        return `Già nello scenario realistico la locazione breve rende <b>${eur(Math.abs(diff))} in più all'anno</b> della locazione lunga al canone richiesto. E mentre l'immobile è rimasto fermo ha già maturato <b>${eur(sfitto)} di canoni persi</b>: la locazione breve parte a produrre entro 2 settimane e lascia l'immobile sempre disponibile per vendita o uso futuro.`;
      }
      return `Al canone teorico di ${eur(r.input.canoneMensile)}, la locazione lunga renderebbe quanto il nostro scenario realistico. Ma quel canone non viene incassato: l'immobile è fermo e ha già maturato <b>${eur(sfitto)} di canoni persi</b> — più del divario stesso. La locazione breve parte a produrre entro 2 settimane e lascia l'immobile sempre disponibile per vendita o locazione futura.`;
    }
    // Nessuno sfitto: il confronto si regge sui numeri e sulla flessibilità, senza narrativa "immobile fermo".
    if (diff >= 0) {
      const prudenteWins = r.scenari.prudente.netto >= r.confronto44.netto;
      const prud = prudenteWins
        ? " — e resta sopra il 4+4 persino nello scenario <b>prudente</b>, il nostro impegno minimo"
        : "";
      return `Nello scenario realistico la locazione breve rende <b>${eur(Math.abs(diff))} in più all'anno</b> della locazione lunga al canone richiesto${prud}. In più lascia l'immobile sempre disponibile per vendita o uso futuro, con il margine di crescita del pricing dinamico che il canone bloccato del 4+4 non ha.`;
    }
    return `Al canone richiesto la locazione lunga, sulla carta, renderebbe un po' di più. Ma la locazione breve tiene già il passo nello scenario realistico, mantiene l'immobile <b>sempre disponibile</b> per vendita o uso futuro, e con il pricing dinamico ha margine di crescita che il canone bloccato del 4+4 non ha.`;
  }

  function pageMetodo(r) {
    const s = r.scenari;
    const ass = [];
    if (r.derivati.adrManuale) {
      // ADR fissato a mano su comparable di mercato: mostro direttamente la tariffa realistica.
      ass.push(["ADR realistico (comparable di mercato)", eur(s.realistico.adr) + "/notte", "Tariffa di segmento verificata sui comparable della zona"]);
    } else {
      const adrNote = s.realistico.adr <= TRACK_RECORD.bestAdr + 1
        ? "In linea col nostro best performer (~" + eur(TRACK_RECORD.bestAdr) + ")"
        : "Fascia " + r.derivati.fasciaLabel.toLowerCase() + ": comparable di mercato di segmento";
      ass.push(
        ["Tariffa base zona (" + r.derivati.zonaLabel.split("/")[0] + "), " + r.input.postiLetto + " posti", eur(r.derivati.adrBase) + "/notte", "Comparable di zona + portfolio Spacely"],
        ["Premio qualità (" + r.derivati.statoLabel.toLowerCase() + ")", "+" + pct(r.derivati.correttivoStato), "Delta ADR osservato tra i nostri immobili"]
      );
      if (r.derivati.premioFascia > 0)
        ass.push(["Premio fascia (" + r.derivati.fasciaLabel.toLowerCase() + ")", "+" + pct(r.derivati.premioFascia), "Segmento superiore alla fascia media del portfolio"]);
      ass.push(["ADR risultante (realistico)", eur(s.realistico.adr) + "/notte", adrNote]);
    }
    ass.push(
      ["Occupazione realistica", pct(s.realistico.occ), r.derivati.occManuale
        ? "Impostata sui comparable dell'immobile"
        : (ZONES.find((z) => z.key === r.input.zona || z.label === r.input.zona) || {}).occFonte || "Comparable di zona"],
      ["Commissioni portali", pct(r.params.ota), "Mix effettivo Airbnb / Booking"],
      ["Fee di gestione Spacely", pct(r.params.feeSpacely) + " dei ricavi lordi", "Tutto incluso: nessun costo di attivazione"]
    );
    const assRows = ass.map((a) => `<tr><td>${esc(a[0])}</td><td class="n">${esc(a[1])}</td><td>${esc(a[2])}</td></tr>`).join("");
    return `<section class="page"><div class="page__body">
      ${rhead(r)}
      <h1 class="title">Come arriviamo a questi numeri</h1>
      <div class="accent-rule"></div>
      <p class="lead">Nessuna stima ottimistica: ogni numero deriva dai dati reali del nostro portfolio a Torino (PriceLabs, gen–lug 2026) e dai valori di mercato della zona. Le assunzioni sono dichiarate e verificabili.</p>

      <h2 class="sect">Le assunzioni di questa analisi</h2>
      <table class="data">
        <thead><tr><th>Parametro</th><th class="n">Valore</th><th>Fonte</th></tr></thead>
        <tbody>${assRows}</tbody>
      </table>

      <h2 class="sect">Il nostro track record: più del doppio del mercato</h2>
      <div class="split">
        <div>${occupancyChart()}</div>
        <div>
          <p class="body">Il nostro portfolio viaggia a un'<b>occupazione media dell'${pctP(TRACK_RECORD.occupancyMedia)}</b> contro un mercato torinese al ${pct(TRACK_RECORD.marketOccupancyLow)}–${pct(TRACK_RECORD.marketOccupancyHigh)}. Il risultato viene da pricing dinamico quotidiano, annunci curati professionalmente, risposta agli ospiti in minuti e presenza su più canali.</p>
          <p class="body">Il nostro miglior immobile — un bilocale a Porta Nuova — ha chiuso il semestre all'<b>${pctP(TRACK_RECORD.bestOccupancy)} di occupazione con ${eur(TRACK_RECORD.bestAdr)} di tariffa media</b>.</p>
          <p class="small">${esc(baseStatistica())} Fonte: PriceLabs Portfolio Analytics.</p>
        </div>
      </div>

      <h2 class="sect">Cosa include la gestione al ${pct(r.params.feeSpacely)}</h2>
      <p class="body">Creazione e ottimizzazione annunci · pricing dinamico giornaliero · gestione prenotazioni e comunicazione ospiti 7/7 · check-in e assistenza · coordinamento pulizie e biancheria · manutenzioni ordinarie coordinate · report mensile trasparente · adempimenti su alloggiati web e tassa di soggiorno.</p>
      ${rfoot(r, 3)}
    </div></section>`;
  }

  function pageChiSiamo(r) {
    const steps = [
      ["Incontro conoscitivo (30 min)", "Visitiamo l'immobile, verifichiamo insieme le assunzioni di questa analisi e rispondiamo a ogni domanda."],
      ["Contratto di gestione", "Mandato chiaro, fee unica al " + pct(r.params.feeSpacely) + ", nessun costo di attivazione, nessun vincolo pluriennale nascosto."],
      ["Messa a reddito in 2 settimane", "Shooting fotografico, pubblicazione multi-canale, pricing attivo. L'immobile inizia a produrre."],
      ["Report mensile", "Ogni mese: occupazione, ricavi, netto maturato. Gli stessi numeri di questa analisi, ma consuntivi."],
    ];
    const stepRows = steps.map((st, i) => `<div class="step"><div class="n">${i + 1}</div><div><div class="t">${esc(st[0])}</div><div class="d">${esc(st[1])}</div></div></div>`).join("");
    const hasSfitto = (r.input.mesiSfitto || 0) >= 1;
    const urgency = hasSfitto
      ? `Intanto l'immobile continua a costare: ogni mese fermo è <b>${eur(r.input.canoneMensile)}</b> di rendita che non torna. Prima partiamo, prima produce.`
      : `Ogni mese di attesa è rendita che non incassa: prima partiamo, prima l'immobile produce.`;
    return `<section class="page"><div class="page__body">
      ${rhead(r)}
      <h1 class="title">Chi siamo e il prossimo passo</h1>
      <div class="accent-rule"></div>
      <p class="lead">Spacely è una società di gestione di locazioni brevi con base a Torino. Gestiamo un portfolio di immobili tra centro e semicentro con un modello costruito sui dati: pricing dinamico, reportistica mensile e totale trasparenza sui numeri — la stessa che trova in questo documento.</p>

      <div class="kpis" style="margin:14px 0 6px">
        <div class="kpi accent"><div class="num">${r.input.immobiliGestiti || TRACK_RECORD.immobili}</div><div class="lab">Immobili gestiti<br>a Torino</div></div>
        <div class="kpi"><div class="num">${pctP(TRACK_RECORD.occupancyMedia)}</div><div class="lab">Occupazione media<br>del portfolio</div></div>
        <div class="kpi"><div class="num">${pctP(TRACK_RECORD.bestOccupancy)}</div><div class="lab">Occupazione del<br>best performer</div></div>
        <div class="kpi"><div class="num">${eur(TRACK_RECORD.bestAdr)}</div><div class="lab">ADR del<br>best performer</div></div>
      </div>

      <h2 class="sect">Come funziona l'avvio</h2>
      <div class="steps">${stepRows}</div>

      <div class="cta">
        <b>Fissi la sua consulenza gratuita: 30 minuti, di persona o in videocall.</b>
        <p>Verifichiamo insieme ogni numero di questo documento sul suo immobile e le diciamo esattamente da dove partire. Nessun costo di attivazione, nessun vincolo pluriennale: decide dopo. Se sceglie di partire, è a reddito in 2 settimane.</p>
        <p class="cta__urgency">${urgency}</p>
        <div class="cta__foot">
          <div class="cta__col">
            <div class="cta__label">Il team Spacely</div>
            <div class="cta__team">Antonino Principato · Lorenzo Fanton · Riccardo Sanino</div>
            <div class="cta__lines"><a href="mailto:thisisspacely@gmail.com">thisisspacely@gmail.com</a> · <a href="tel:+393357242076">+39 335 7242076</a> · <a href="tel:+393485919277">+39 348 5919277</a></div>
          </div>
          <div class="cta__col cta__col--social">
            <div class="cta__label">Seguici</div>
            <a class="cta__social" href="https://www.instagram.com/spacely_italy/">Instagram · @spacely_italy</a>
            <a class="cta__social" href="https://www.linkedin.com/company/thisisspacely/">LinkedIn · Spacely</a>
          </div>
        </div>
      </div>
      <p class="small" style="margin-top:10px">Le proiezioni non costituiscono garanzia di rendimento. Aspetti fiscali indicativi: da verificare con il proprio consulente. Dati portfolio: PriceLabs Portfolio Analytics, 02/07/2026.</p>
      ${rfoot(r, 4)}
    </div></section>`;
  }

  // ---------- render ----------
  function render() {
    let r;
    try { r = computeReport(state); }
    catch (e) { document.getElementById("report").innerHTML = `<div style="color:#fff;padding:20px">${esc(e.message)}</div>`; return; }
    document.getElementById("report").innerHTML =
      pageCover(r) + pageProiezione(r) + pageMetodo(r) + pageChiSiamo(r);
  }

  function init() {
    document.getElementById("brandLogo").innerHTML =
      mark("sidebar__mark") + `<div><b>${wordmark}</b><span>Analisi di Rendita</span></div>`;
    buildForm();
    render();
  }

  return { init, render };
});

</script>
  <script>SpacelyApp.init();</script>
</body>
</html>
